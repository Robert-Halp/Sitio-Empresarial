<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Constructora · Panel de operaciones</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b45309'/%3E%3Cpath d='M8 24V14l8-6 8 6v10h-5v-6h-6v6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#f5f6f8; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e6e9ef;
    --accent:#b45309; --accent-2:#f59e0b; --accent-soft:#fff7ed;
    --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2;
    --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.05), 0 12px 32px -20px rgba(15,23,42,.35);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; letter-spacing:-.02em}

  /* ---------- cabecera ---------- */
  .top{
    background:radial-gradient(1200px 300px at 10% -120px,#7c2d12 0%,#431407 55%,#1c0a05 100%);
    color:#fff; padding:26px 24px 22px;
  }
  .top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:13px;flex:none;
    background:linear-gradient(145deg,var(--accent-2),var(--accent));
    display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(245,158,11,.8)
  }
  .logo svg{width:26px;height:26px;fill:#2b1206}
  .brand h1{font-size:20px;font-weight:650}
  .brand p{margin:1px 0 0;color:#fcd9a8;font-size:13px}
  .live{
    display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
    padding:7px 13px;border-radius:999px;color:#fde8c7
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.22)}
  .dot.err{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.22)}
  .dot.load{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.22);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:22px 24px 56px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
  .tabs button{
    font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    background:transparent;border:1px solid transparent;border-radius:10px;
    padding:8px 14px;cursor:pointer;transition:.15s
  }
  .tabs button:hover{background:#eef1f5;color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
  .tabs .n{color:var(--muted);font-weight:500;margin-left:5px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 20px;border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:17px;font-weight:650}
  .sub{margin:2px 0 0;color:var(--muted);font-size:13px}

  .search{position:relative;flex:none}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2}
  .search input{
    font:inherit;font-size:13.5px;width:230px;max-width:52vw;padding:8px 12px 8px 33px;
    border:1px solid var(--line);border-radius:10px;background:#fbfcfd;color:var(--ink);outline:none
  }
  .search input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}

  /* ---------- tarjetas ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent-2);opacity:.85}
  .kpi .lbl{font-size:12px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .hint{font-size:12.5px;color:var(--muted);margin-top:2px}
  .kpi.warn::after{background:var(--bad)}
  .kpi.warn .val{color:var(--bad)}

  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
  @media (max-width:820px){.grid2{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
  .card h3{font-size:14px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
  .card h3 span{font-size:12px;font-weight:500;color:var(--muted)}

  /* barras de estado */
  .bar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
  .bar .name{color:var(--muted);text-transform:capitalize}
  .bar .track{height:9px;border-radius:999px;background:#eef1f5;overflow:hidden}
  .bar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent));min-width:4px}
  .bar .qty{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}

  .mini{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
  .mini:first-of-type{border-top:0;padding-top:0}
  .mini .r{text-align:right;white-space:nowrap}

  /* ---------- tablas ---------- */
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{
    text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);font-weight:650;padding:11px 16px;background:#fafbfc;
    border-bottom:1px solid var(--line);white-space:nowrap
  }
  thead th button{
    all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit
  }
  thead th button:hover{color:var(--ink)}
  thead th .arw{opacity:.35;font-size:10px}
  thead th.sorted .arw{opacity:1;color:var(--accent)}
  tbody td{padding:12px 16px;border-bottom:1px solid #f1f3f7;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfcfd}
  td.strong{font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}

  .badge{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;text-transform:capitalize}
  .b-planificacion{background:#e0e7ff;color:#3730a3}
  .b-permisos{background:#ede9fe;color:#5b21b6}
  .b-cimentacion{background:#fef3c7;color:#92400e}
  .b-estructura{background:#ffedd5;color:#9a3412}
  .b-acabados{background:#ccfbf1;color:#115e59}
  .b-entregado{background:var(--ok-soft);color:var(--ok)}
  .b-cancelado{background:var(--bad-soft);color:var(--bad)}

  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:7px;background:#f1f5f9;color:#475569;text-transform:capitalize}
  .yes{color:var(--ok);font-weight:650}
  .no{color:var(--muted)}
  .low{color:var(--bad);font-weight:700}

  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:11px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);background:#fafbfc}

  .empty{padding:44px 20px;text-align:center;color:var(--muted)}

  /* ---------- estados de carga / error ---------- */
  .loading{padding:70px 20px;text-align:center;color:var(--muted)}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .error{background:var(--bad-soft);border:1px solid #fecaca;color:#7f1d1d;border-radius:var(--radius);padding:16px 18px;margin-bottom:18px}
  .error strong{display:block;margin-bottom:4px}
  .error code{font-size:12px;word-break:break-word;opacity:.85}
  .error button{
    margin-top:12px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;
    background:#fff;color:#7f1d1d;border:1px solid #fca5a5;border-radius:9px;padding:7px 14px
  }

  footer.page{max-width:1180px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  footer.page a{color:var(--accent);text-decoration:none;font-weight:600}
  footer.page a:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 20V9.5L12 4l8 5.5V20h-6v-5h-4v5z"/></svg>
      </div>
      <div>
        <h1>Constructora</h1>
        <p>Panel de operaciones · schema <code>constructora</code></p>
      </div>
    </div>
    <div class="live" id="live"><span class="dot load"></span><span id="live-txt">Conectando…</span></div>
  </div>
</header>

<main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  <div id="aviso"></div>
  <div id="vista"></div>
</main>

<footer class="page">
  <span>Datos de demostración · Supabase + PostgREST (solo lectura)</span>
  <a href="https://web-marga4.vercel.app" target="_blank" rel="noopener">Sitio web y formulario de contacto →</a>
</footer>

<script>
/* =========================================================
   Configuración: claves PÚBLICAS (anon). RLS + vistas
   garantizan que desde aquí solo se puede leer.
   ========================================================= */
const CFG = {
  url: "https://qflopcnipzecycjopulg.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmbG9wY25pcHplY3ljam9wdWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NDY5OTIsImV4cCI6MjExMDUyMjk5Mn0.daZChfRPz-YS3ZfTR_VV9nQoFFq_CVFotL424Zp5shs",
  schema: "constructora"
};

const TABLAS = {
  clientes:     { vista: "vista_clientes",     titulo: "Clientes",     sub: "Personas y empresas que contratan una obra" },
  proyectos:    { vista: "vista_proyectos",    titulo: "Proyectos",    sub: "Obras en curso, presupuesto y fechas" },
  empleados:    { vista: "vista_empleados",    titulo: "Empleados",    sub: "Plantilla de la constructora (sin salario)" },
  asignaciones: { vista: "vista_asignaciones", titulo: "Asignaciones", sub: "Quién trabaja en qué obra y con qué rol" },
  materiales:   { vista: "vista_materiales",   titulo: "Materiales",   sub: "Catálogo, precios y existencias" }
};

const COLS = {
  clientes: [
    { k: "nombre",     t: "Cliente",    tipo: "fuerte" },
    { k: "email",      t: "Email" },
    { k: "telefono",   t: "Teléfono" },
    { k: "direccion",  t: "Dirección" },
    { k: "creado_en",  t: "Alta",       tipo: "fecha" }
  ],
  proyectos: [
    { k: "nombre",        t: "Proyecto",     tipo: "fuerte" },
    { k: "cliente",       t: "Cliente" },
    { k: "estado",        t: "Estado",       tipo: "estado" },
    { k: "presupuesto",   t: "Presupuesto",  tipo: "dinero", dec: 0, num: true },
    { k: "fecha_inicio",  t: "Inicio",       tipo: "fecha" },
    { k: "fecha_entrega", t: "Entrega",      tipo: "fecha" }
  ],
  empleados: [
    { k: "nombre",        t: "Empleado",   tipo: "fuerte" },
    { k: "puesto",        t: "Puesto",     tipo: "puesto" },
    { k: "telefono",      t: "Teléfono" },
    { k: "activo",        t: "Activo",     tipo: "bool" },
    { k: "contratado_en", t: "Contratado", tipo: "fecha" }
  ],
  asignaciones: [
    { k: "empleado",       t: "Empleado",  tipo: "fuerte" },
    { k: "puesto",         t: "Puesto",    tipo: "puesto" },
    { k: "proyecto",       t: "Proyecto" },
    { k: "rol_en_obra",    t: "Rol en obra" },
    { k: "horas_semanales",t: "Horas/sem", num: true },
    { k: "desde",          t: "Desde",     tipo: "fecha" }
  ],
  materiales: [
    { k: "nombre",          t: "Material",    tipo: "fuerte" },
    { k: "unidad",          t: "Unidad" },
    { k: "precio_unitario", t: "Precio unit.", tipo: "dinero", dec: 2, num: true },
    { k: "stock",           t: "Stock",        tipo: "stock", num: true },
    { k: "proveedor",       t: "Proveedor" }
  ]
};

const ORDEN_INICIAL = {
  clientes:     { k: "nombre",        dir: 1 },
  proyectos:    { k: "presupuesto",   dir: -1 },
  empleados:    { k: "nombre",        dir: 1 },
  asignaciones: { k: "empleado",      dir: 1 },
  materiales:   { k: "stock",         dir: -1 }
};

const ESTADOS = ["planificacion", "permisos", "cimentacion", "estructura", "acabados", "entregado", "cancelado"];

/* ---------------- estado ---------------- */
const datos = {};
const filtros = { clientes: "", proyectos: "", empleados: "", asignaciones: "", materiales: "" };
const orden = JSON.parse(JSON.stringify(ORDEN_INICIAL));
let pestaña = "resumen";
let cargando = true;
let error = null;

/* ---------------- utilidades ---------------- */
const $ = (sel) => document.querySelector(sel);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function dinero(v, dec = 0) {
  if (v === null || v === undefined) return "—";
  return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: dec, maximumFractionDigits: dec }).format(Number(v));
}
function fecha(v) {
  if (!v) return "—";
  const d = new Date(String(v).slice(0, 10) + "T00:00:00");
  return d.toLocaleDateString("es-MX", { day: "2-digit", month: "short", year: "numeric" });
}
function humano(v) {
  if (!v) return "—";
  const s = String(v).replace(/_/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function texto(v) {
  if (v === null || v === undefined || v === "") return "—";
  if (typeof v === "boolean") return v ? "Sí" : "No";
  return String(v);
}
function diasHasta(f) {
  if (!f) return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const d = new Date(String(f).slice(0, 10) + "T00:00:00");
  return Math.round((d - hoy) / 86400000);
}

/* ---------------- API ---------------- */
async function pedirVista(vista) {
  const res = await fetch(`${CFG.url}/rest/v1/${vista}?select=*`, {
    headers: {
      apikey: CFG.key,
      Authorization: `Bearer ${CFG.key}`,
      "Accept-Profile": CFG.schema
    }
  });
  if (!res.ok) {
    const detalle = (await res.text()).slice(0, 180);
    throw new Error(`${vista}: HTTP ${res.status} · ${detalle}`);
  }
  return res.json();
}

async function cargarTodo() {
  cargando = true; error = null; pintar();
  try {
    const nombres = Object.keys(TABLAS);
    const resultados = await Promise.all(nombres.map((n) => pedirVista(TABLAS[n].vista)));
    nombres.forEach((n, i) => { datos[n] = resultados[i]; });
    cargando = false;
  } catch (e) {
    cargando = false;
    error = e.message || String(e);
  }
  pintar();
  marcarLive();
}

function marcarLive() {
  const dot = $("#live .dot");
  const txt = $("#live-txt");
  if (!dot) return;
  dot.className = "dot " + (error ? "err" : cargando ? "load" : "");
  txt.textContent = error ? "Sin conexión" : cargando ? "Conectando…" : "En vivo · Supabase";
}

/* ---------------- pintado general ---------------- */
function pintar() {
  pintarTabs();
  const aviso = $("#aviso");
  aviso.innerHTML = error
    ? `<div class="error"><strong>No se pudieron cargar los datos</strong>
         <code>${esc(error)}</code>
         <div><button id="reintentar">Reintentar</button></div></div>`
    : "";

  const btn = $("#reintentar");
  if (btn) btn.addEventListener("click", cargarTodo);

  if (cargando) {
    $("#vista").innerHTML = `<div class="panel"><div class="loading"><div class="spinner"></div>Cargando datos de la constructora…</div></div>`;
    return;
  }
  if (error) { $("#vista").innerHTML = ""; return; }

  if (pestaña === "resumen") pintarResumen();
  else pintarTabla(pestaña);
}

function pintarTabs() {
  const items = [["resumen", "Resumen", "—"], ...Object.entries(TABLAS).map(([k, v]) => [k, v.titulo, datos[k] ? datos[k].length : "—"])];
  $("#tabs").innerHTML = items.map(([k, t, n]) => `
    <button role="tab" data-tab="${k}" aria-selected="${pestaña === k}">
      ${esc(t)}<span class="n">${esc(n)}</span>
    </button>`).join("");
}

/* ---------------- resumen ---------------- */
function pintarResumen() {
  const p = datos.proyectos || [];
  const enObra = p.filter((x) => !["entregado", "cancelado"].includes(x.estado));
  const cartera = enObra.reduce((s, x) => s + (Number(x.presupuesto) || 0), 0);
  const bajo = (datos.materiales || []).filter((m) => Number(m.stock) < 120);

  const conteo = {};
  ESTADOS.forEach((e) => (conteo[e] = 0));
  p.forEach((x) => { if (conteo[x.estado] !== undefined) conteo[x.estado]++; });
  const max = Math.max(1, ...Object.values(conteo));

  const proximas = [...p]
    .filter((x) => x.fecha_entrega && !["entregado", "cancelado"].includes(x.estado))
    .sort((a, b) => new Date(a.fecha_entrega) - new Date(b.fecha_entrega))
    .slice(0, 4);

  $("#vista").innerHTML = `
    <div class="kpis">
      <div class="kpi">
        <div class="lbl">Clientes</div>
        <div class="val">${(datos.clientes || []).length}</div>
        <div class="hint">registrados en el sistema</div>
      </div>
      <div class="kpi">
        <div class="lbl">Proyectos en obra</div>
        <div class="val">${enObra.length}</div>
        <div class="hint">de ${p.length} en total</div>
      </div>
      <div class="kpi">
        <div class="lbl">Cartera en obra</div>
        <div class="val">${dinero(cartera)}</div>
        <div class="hint">presupuesto de obras activas</div>
      </div>
      <div class="kpi ${bajo.length ? "warn" : ""}">
        <div class="lbl">Materiales por reponer</div>
        <div class="val">${bajo.length}</div>
        <div class="hint">stock menor a 120</div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Proyectos por estado <span>${p.length} en total</span></h3>
        ${ESTADOS.filter((e) => conteo[e] > 0).map((e) => `
          <div class="bar">
            <div class="name">${esc(humano(e))}</div>
            <div class="track"><div class="fill" style="width:${(conteo[e] / max) * 100}%"></div></div>
            <div class="qty">${conteo[e]}</div>
          </div>`).join("") || `<p class="muted">Sin proyectos registrados.</p>`}
      </div>

      <div class="card">
        <h3>Próximas entregas <span>orden cronológico</span></h3>
        ${proximas.map((x) => {
          const d = diasHasta(x.fecha_entrega);
          const etiqueta = d === null ? "" : d < 0 ? "vencido" : d === 0 ? "hoy" : `en ${d} d`;
          return `<div class="mini">
            <div><strong>${esc(x.nombre)}</strong><br><span class="muted" style="font-size:12.5px">${esc(x.cliente)}</span></div>
            <div class="r">${fecha(x.fecha_entrega)}<br><span class="muted" style="font-size:12px">${etiqueta}</span></div>
          </div>`;
        }).join("") || `<p class="muted">No hay entregas programadas.</p>`}
      </div>
    </div>`;
}

/* ---------------- tablas ---------------- */
function pintarTabla(nombre) {
  const info = TABLAS[nombre];
  $("#vista").innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>${esc(info.titulo)}</h2>
          <p class="sub">${esc(info.sub)}</p>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Buscar en ${esc(info.titulo.toLowerCase())}…" value="${esc(filtros[nombre])}" aria-label="Buscar">
        </div>
      </div>
      <div id="lista"></div>
    </div>`;

  $("#q").addEventListener("input", (e) => {
    filtros[nombre] = e.target.value;
    pintarFilas(nombre);
  });

  $("#lista").addEventListener("click", (e) => {
    const btn = e.target.closest("th button[data-k]");
    if (!btn) return;
    const k = btn.dataset.k;
    const o = orden[nombre];
    if (o.k === k) o.dir *= -1;
    else { o.k = k; o.dir = 1; }
    pintarFilas(nombre);
  });

  pintarFilas(nombre);
}

function filasVisibles(nombre) {
  const cols = COLS[nombre];
  const q = filtros[nombre].trim().toLowerCase();
  let filas = [...(datos[nombre] || [])];

  if (q) {
    filas = filas.filter((f) =>
      cols.some((c) => {
        const v = f[c.k];
        const s = typeof v === "boolean" ? (v ? "si" : "no") : String(v ?? "").toLowerCase();
        return s.includes(q);
      })
    );
  }

  const { k, dir } = orden[nombre];
  const col = cols.find((c) => c.k === k) || cols[0];
  filas.sort((a, b) => {
    let va = a[col.k], vb = b[col.k];
    if (col.tipo === "dinero" || col.num || col.tipo === "stock") {
      va = Number(va) || 0; vb = Number(vb) || 0;
      return (va - vb) * dir;
    }
    va = String(va ?? "").toLowerCase();
    vb = String(vb ?? "").toLowerCase();
    return va.localeCompare(vb, "es") * dir;
  });
  return filas;
}

function celda(fila, col) {
  const v = fila[col.k];
  if (v === null || v === undefined || v === "") return `<span class="muted">—</span>`;
  switch (col.tipo) {
    case "estado":
      return `<span class="badge b-${esc(v)}">${esc(humano(v))}</span>`;
    case "puesto":
      return `<span class="tag">${esc(humano(v))}</span>`;
    case "dinero":
      return `<span>${dinero(v, col.dec ?? 0)}</span>`;
    case "fecha":
      return `<span class="muted">${fecha(v)}</span>`;
    case "bool":
      return v ? `<span class="yes">Sí</span>` : `<span class="no">No</span>`;
    case "stock":
      return `<span class="${Number(v) < 120 ? "low" : ""}">${esc(v)}</span>`;
    default:
      return esc(v);
  }
}

function pintarFilas(nombre) {
  const cols = COLS[nombre];
  const filas = filasVisibles(nombre);
  const total = (datos[nombre] || []).length;
  const o = orden[nombre];

  const head = cols.map((c) => {
    const activa = o.k === c.k;
    return `<th class="${activa ? "sorted" : ""}" ${c.num ? 'style="text-align:right"' : ""}>
      <button data-k="${c.k}">${esc(c.t)}<span class="arw">${activa ? (o.dir === 1 ? "▲" : "▼") : "↕"}</span></button>
    </th>`;
  }).join("");

  const body = filas.map((f) => `
    <tr>${cols.map((c) => `<td class="${c.tipo === "fuerte" ? "strong" : ""} ${c.num ? "num" : ""}">${celda(f, c)}</td>`).join("")}</tr>
  `).join("");

  $("#lista").innerHTML = `
    <div class="table-scroll">
      <table>
        <thead><tr>${head}</tr></thead>
        <tbody>${body || `<tr><td colspan="${cols.length}"><div class="empty">Sin resultados para “${esc(filtros[nombre])}”.</div></td></tr>`}</tbody>
      </table>
    </div>
    <div class="foot">
      <span>Mostrando <strong>${filas.length}</strong> de ${total} registros</span>
      <span>schema <code>${esc(CFG.schema)}</code> · solo lectura</span>
    </div>`;
}

/* ---------------- navegación ---------------- */
function ir(nombre) {
  pestaña = nombre;
  filtros[nombre] = "";
  if (location.hash.slice(1) !== nombre) history.replaceState(null, "", "#" + nombre);
  pintar();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("#tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (btn) ir(btn.dataset.tab);
});

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if ((h === "resumen" || TABLAS[h]) && h !== pestaña) { pestaña = h; pintar(); }
});

/* ---------------- arranque ---------------- */
const inicial = location.hash.slice(1);
pestaña = inicial === "resumen" || TABLAS[inicial] ? inicial : "resumen";
marcarLive();
cargarTodo();
</script>
</body>
</html>
