<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Constructora · Panel de operaciones</title>
<meta name="description" content="Panel de operaciones de la constructora: clientes, proyectos, empleados, materiales, pagos y avances.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f59e0b'/%3E%3Cpath d='M8 24V14l8-6 8 6v10h-5v-6h-6v6z' fill='%231a120c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<div class="shell">

  <!-- ============ barra lateral ============ -->
  <aside class="side">
    <div class="side-brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 20V9.5L12 4l8 5.5V20h-6v-5h-4v5z"/></svg>
      </div>
      <div class="brand-txt">
        <strong>Constructora</strong>
        <span>Panel de operaciones</span>
      </div>
    </div>

    <nav class="side-nav" id="nav" aria-label="Secciones"></nav>

    <div class="side-foot">
      <div class="live" id="live" title="Conectando con Supabase"><span class="dot load"></span><span id="live-txt">Conectando…</span></div>
      <p>Datos en vivo desde Supabase.<br>Modo demo: escritura habilitada.</p>
    </div>
  </aside>

  <!-- ============ contenido ============ -->
  <div class="content">
    <header class="page-head">
      <div class="page-title">
        <p class="eyebrow" id="eyebrow">General</p>
        <h1 id="page-title">Resumen</h1>
        <p class="page-sub" id="page-sub">Vista rápida de la operación.</p>
      </div>
      <div class="head-actions">
        <span class="updated" id="updated"></span>
        <button class="btn" id="refrescar" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
          <span>Actualizar</span>
        </button>
      </div>
    </header>

    <div id="aviso"></div>
    <div id="vista" class="view"></div>

    <footer class="foot">
      <span>Datos de demostración · Supabase + PostgREST</span>
      <a href="https://web-marga4.vercel.app" target="_blank" rel="noopener">Sitio web y formulario de contacto →</a>
    </footer>
  </div>
</div>

<!-- ============ modal de alta / edición ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title">Nuevo registro</h3>
      <button class="icon-btn" id="modal-close" type="button" aria-label="Cerrar">✕</button>
    </div>
    <form id="modal-form" novalidate>
      <div class="form-grid" id="modal-fields"></div>
      <div class="form-error" id="modal-error" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="modal-save">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js?v=4"></script>
</body>
</html>
